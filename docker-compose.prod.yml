services:
  lernplan-reminder-bot-v2:
    # Image-Tag Optionen (Workflow baut: branch-<name>, sha-<hash>):
    # - branch-main (Production-ready, stabil)
    # - branch-develop (neueste Features, Testing)
    # - branch-<name> (Spezifischer Feature-Branch)
    # - sha-<hash> (spezifischer Commit)
    image: ghcr.io/portboy/lernplanreminderbot_v2:branch-main
    container_name: lernplan-reminder-bot-v2
    restart: unless-stopped
    
    # Daten und Konfiguration persistent speichern
    volumes:
      - ./data:/app/data
      - ./userconfig:/app/userconfig
    
    # Keine Ports nötig - Bot nutzt ausgehende Verbindungen zu Telegram
    
    # Health Check (aktiviert)
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging-Konfiguration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Optional: Ressourcenlimits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 256M
    #     reservations:
    #       cpus: '0.1'
    #       memory: 64M
    
    # Optional: Watchtower Auto-Update
    # labels:
    #   - "com.centurylinklabs.watchtower.enable=true"

# ============================================================================
# Schnellstart für Production:
# ============================================================================
# 1. Verzeichnisse erstellen:
#    mkdir -p data userconfig
#
# 2. Konfiguration erstellen:
#    Kopiere userconfig/bot_config.json (aus Repository) nach ./userconfig/
#    Editiere die Datei und setze deine Werte:
#    - telegram_token
#    - student_chat_id
#    - parent_chat_id
#
# 3. Starten:
#    docker compose -f docker-compose.prod.yml up -d
#
# 4. Konfiguration zur Laufzeit ändern:
#    Editiere: ./userconfig/bot_config.json
#    Neustart: docker compose -f docker-compose.prod.yml restart
#    (Dauert nur ~5 Sekunden, kein Rebuild nötig!)
#
# 5. Logs:
#    docker compose -f docker-compose.prod.yml logs -f
#
# 6. Updates:
#    Production (branch-main):
#      docker compose -f docker-compose.prod.yml pull
#      docker compose -f docker-compose.prod.yml up -d
#
#    Testing (develop Branch):
#      Aendere in Zeile 9: branch-main zu branch-develop
#      docker compose -f docker-compose.prod.yml pull
#      docker compose -f docker-compose.prod.yml up -d
#
#    Spezifischer Branch:
#      Aendere in Zeile 9: branch-main zu branch-feature-name
#      docker compose -f docker-compose.prod.yml pull
#      docker compose -f docker-compose.prod.yml up -d
