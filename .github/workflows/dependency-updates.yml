name: Dependency Updates & Security Check

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  security-check:
    name: Security Vulnerability Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
    
    - name: Run pip-audit for security vulnerabilities
      run: |
        pip install pip-audit
        pip-audit --desc || echo "::warning::Security vulnerabilities detected. Please review."
    
    - name: Check for outdated dependencies
      id: outdated
      run: |
        echo "## Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
        pip list --outdated || true
        echo "" >> $GITHUB_STEP_SUMMARY
        
    - name: Create issue if vulnerabilities found
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = '🔒 Security Alert: Vulnerabilities Detected';
          const body = `Security vulnerabilities were detected in dependencies.
          
          Please review the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.
          
          Run \`pip-audit\` locally to investigate:
          \`\`\`bash
          pip install pip-audit
          pip-audit
          \`\`\``;
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['security', 'dependencies']
          });

  check-updates:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
    
    - name: Check for outdated packages
      id: check-outdated
      run: |
        echo "## 📦 Dependency Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        pip list --outdated --format=columns >> $GITHUB_STEP_SUMMARY || echo "All dependencies are up to date! ✅" >> $GITHUB_STEP_SUMMARY
    
    - name: Run tests to ensure compatibility
      run: |
        pytest tests/ -v

  docker-security:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image for scanning
      run: |
        docker build -t lernplan-bot:scan .
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'lernplan-bot:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
    
    - name: Upload Trivy results
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
