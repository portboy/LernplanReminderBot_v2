services:
  lernplan-reminder-bot-v2:
    build: .
    container_name: lernplan-reminder-bot-v2
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./userconfig:/app/userconfig
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Optional: Resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 256M

