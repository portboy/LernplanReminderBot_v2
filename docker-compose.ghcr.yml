services:
  lernplan-reminder-bot-v2:
    # Image-Tag Optionen (Workflow baut: branch-<name>, sha-<hash>):
    # - branch-main (stabil, production)
    # - branch-develop (neueste Features, testing)
    # - branch-<name> (feature branches)
    # - sha-<hash> (spezifischer Commit)
    image: ghcr.io/portboy/lernplanreminderbot_v2:branch-main
    container_name: lernplan-reminder-bot-v2
    restart: unless-stopped
    
    # Volumes für persistente Daten und Konfiguration
    volumes:
      - /mnt/user/appdata/LernplanReminderBot_v2/data:/app/data
      - /mnt/user/appdata/LernplanReminderBot_v2/userconfig:/app/userconfig
    
    # Health Check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Keine Ports nötig – Bot stellt ausgehende Verbindungen zu Telegram her
    
    # Optional: Labels, falls du Watchtower oder ähnliches nutzt
    # labels:
    #   - "com.centurylinklabs.watchtower.enable=true"
    
    # Optional: Ressourcenlimits (anpassen wenn gewünscht)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.50'
    #       memory: 256M

# ============================================================================
# Hinweise für Unraid/Production Deployment
# ============================================================================

# 1. Ordner anlegen:
#    mkdir -p /mnt/user/appdata/LernplanReminderBot_v2/data
#    mkdir -p /mnt/user/appdata/LernplanReminderBot_v2/userconfig

# 2. Konfiguration erstellen (EMPFOHLEN):
#    Kopiere userconfig/bot_config.json nach:
#    /mnt/user/appdata/LernplanReminderBot_v2/userconfig/bot_config.json
#    
#    Editiere die Datei und setze:
#    - telegram_token
#    - student_chat_id
#    - parent_chat_id
#    - allowed_subjects (optional, fuer eigene Faecher)

# 3. Alternative: .env Datei (überschreibt bot_config.json):
#    Erstelle /mnt/user/appdata/LernplanReminderBot_v2/.env:
#    TELEGRAM_TOKEN=123456:ABC....
#    STUDENT_CHAT_ID=123456789
#    PARENT_CHAT_ID=987654321
#    LOG_LEVEL=INFO
#    TIMEZONE=Europe/Berlin

# 4. Start:
#    docker compose -f docker-compose.ghcr.yml up -d

# 5. Konfiguration aendern (OHNE Neudeployment!):
#    - Editiere /mnt/user/appdata/.../userconfig/bot_config.json
#    - Restart: docker restart lernplan-reminder-bot-v2
#    - Fertig! (Dauert ~5 Sekunden)

# 6. Update auf neuestes Image:
#    docker compose -f docker-compose.ghcr.yml pull
#    docker compose -f docker-compose.ghcr.yml up -d
#
#    Oder spezifischen Branch verwenden:
#    Editiere Zeile 9 und aendere branch-main zu branch-develop
#    docker compose -f docker-compose.ghcr.yml pull
#    docker compose -f docker-compose.ghcr.yml up -d

# 7. Logs ansehen:
#    docker logs -f lernplan-reminder-bot-v2

# 8. Faecher zur Laufzeit hinzufuegen:
#    Editiere userconfig/bot_config.json und fuege hinzu:
#    {"name": "Geschichte", "emoji": "📜", "color": "#AA96DA"}
#    Dann: docker restart lernplan-reminder-bot-v2
